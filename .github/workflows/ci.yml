name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Install and build web UI
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Ruff
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests/ -m "not lsp" -q

      - name: Validate Claude Code plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate .

  lsp:
    name: LSP scenarios (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install RippleLens
        run: pip install -e ".[dev]"

      - name: Install language servers
        shell: bash
        run: |
          set -e
          go install golang.org/x/tools/gopls@latest
          pip install basedpyright
          npm install -g typescript typescript-language-server
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y clangd-18 || sudo apt-get install -y clangd
          fi

      - name: Doctor
        run: python -m ripplelens doctor || true

      - name: LSP scenarios (skip missing servers)
        run: pytest -m lsp -q --tb=line

  eval-scip:
    name: SCIP judge (optional indexers)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install RippleLens + gopls
        run: |
          pip install -e ".[dev]"
          go install golang.org/x/tools/gopls@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install scip-go when available
        run: go install github.com/sourcegraph/scip-go/cmd/scip-go@latest || true
      - name: Run SCIP judge (skips cases whose indexer is missing)
        run: python eval/scip_judge.py --repos eval/repos.json --case go-cli/help-func --json || true
